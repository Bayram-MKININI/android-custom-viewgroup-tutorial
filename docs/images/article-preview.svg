<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">The same preview changes layout when its title wraps</title>
  <desc id="desc">Try measuring the title beside a square thumbnail. Keep the row if the title needs at most two lines. Otherwise use a full width sixteen by nine image above the title and description. Remeasure the title at full width. The decision uses the trial line count, not the final stacked count.</desc>
  <rect width="1000" height="650" rx="16" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="35" y="42" font-size="24" font-weight="bold">Try the row first. Let the measured title decide.</text>
    <text x="35" y="79" font-size="18">Same window width. Different text can choose a different layout.</text>
    <text x="40" y="132" font-size="21" font-weight="bold">Trial title: 1 or 2 lines</text>
    <rect x="40" y="160" width="420" height="410" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="60" y="185" width="114" height="114" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M68 288L105 215L132 261L148 242L166 288Z" fill="#2563eb"/>
    <rect x="190" y="185" width="250" height="68" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="202" y="214" font-size="18" font-weight="bold">A quiet walk</text>
    <text x="202" y="239" font-size="18" font-weight="bold">through the city</text>
    <rect x="190" y="261" width="250" height="95" rx="4" fill="#fef9c3" stroke="#a16207"/>
    <text x="202" y="291" font-size="17">Description</text>
    <text x="202" y="317" font-size="16">Both texts share</text>
    <text x="202" y="340" font-size="16">the same width.</text>
    <text x="60" y="400" font-size="18" font-weight="bold">Keep the row</text>
    <text x="60" y="432" font-size="17">Square thumbnail: 30% of content width.</text>
    <text x="60" y="462" font-size="17">Image and title share their top edge.</text>
    <text x="60" y="492" font-size="17">16dp column gap. 8dp text gap.</text>
    <text x="535" y="132" font-size="21" font-weight="bold">Trial title: more than 2 lines</text>
    <rect x="535" y="160" width="420" height="410" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="555" y="180" width="380" height="214" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M567 382L670 209L753 340L820 266L923 382Z" fill="#2563eb"/>
    <rect x="555" y="410" width="380" height="62" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="568" y="435" font-size="17" font-weight="bold">A longer title gets the whole width</text>
    <text x="568" y="458" font-size="17" font-weight="bold">instead of a narrow column</text>
    <rect x="555" y="480" width="380" height="65" rx="4" fill="#fef9c3" stroke="#a16207"/>
    <text x="568" y="508" font-size="17">Description below the title.</text>
    <text x="568" y="533" font-size="16">Full-width image uses a 16:9 box.</text>
    <text x="40" y="609" font-size="18">Decision = title lines at the trial row width, before any full-width remeasurement.</text>
  </g>
</svg>
