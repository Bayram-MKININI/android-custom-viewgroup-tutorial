<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Two different meanings of a 30 percent horizontal offset</title>
  <desc id="desc">In the first diagram, the image is outside the text's left edge with a gap of 30 percent of text width. In the second, the image's left edge is 30 percent across the text box and the image overlaps it. Percentages alone do not specify the anchor or direction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="610" rx="16" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="40" y="42" font-size="24" font-weight="bold">"30% left" needs an anchor and a direction</text>
    <text x="40" y="87" font-size="20" font-weight="bold">A. Outside the text, with a gap (implemented example)</text>
    <rect x="120" y="115" width="200" height="130" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="220" y="186" text-anchor="middle" font-size="20">Image</text>
    <rect x="440" y="115" width="400" height="130" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="640" y="186" text-anchor="middle" font-size="20">Text: width T</text>
    <path d="M324 178H436" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="380" y="155" text-anchor="middle" font-size="18" fill="#9a3412">0.3T</text>
    <text x="40" y="285" font-size="18">image.left = text.left - gap - image.width</text>
    <text x="40" y="309" font-size="16" fill="#475569">Our code uses the equivalent: text.left = image.right + gap.</text>
    <path d="M40 335H960" stroke="#cbd5e1"/>
    <text x="40" y="375" font-size="20" font-weight="bold">B. Start 30% across the text (different, overlapping design)</text>
    <rect x="260" y="400" width="400" height="130" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="275" y="430" font-size="17">Text</text>
    <rect x="380" y="442" width="200" height="88" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="480" y="493" text-anchor="middle" font-size="20">Image</text>
    <path d="M264 460H376" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="320" y="488" text-anchor="middle" font-size="18" fill="#9a3412">0.3T</text>
    <text x="700" y="460" font-size="16">Horizontal placement only;</text>
    <text x="700" y="484" font-size="16">choose vertical placement</text>
    <text x="700" y="508" font-size="16">and draw order separately.</text>
    <text x="40" y="575" font-size="18">image.left = text.left + (text.measuredWidth * 0.3).toInt()</text>
  </g>
</svg>
