<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Yumi's message-row layout rules</title>
  <desc id="desc">A priority icon sits at the start. The subject sits beside it. The timestamp sits at the end and reserves space before the subject is measured. The body aligns with the subject but can use the space below the timestamp. It begins below the taller of the two header texts.</desc>
  <rect width="1000" height="590" rx="16" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="35" y="42" font-size="25" font-weight="bold">A real message row: four children, one parent</text>
    <rect x="45" y="105" width="910" height="315" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="75" y="145" width="64" height="64" rx="4" fill="#ffedd5" stroke="#b45309"/>
    <path d="M107 153L133 201H81Z" fill="#b45309"/>
    <text x="107" y="193" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff">!</text>
    <rect x="165" y="145" width="515" height="100" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="185" y="185" font-size="22" font-weight="bold">A subject can wrap</text>
    <text x="185" y="218" font-size="22" font-weight="bold">without covering the time</text>
    <rect x="735" y="145" width="185" height="50" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="827" y="178" text-anchor="middle" font-size="22">17:17</text>
    <text x="742" y="223" font-size="16">Measure time first</text>
    <path d="M165 130V395" stroke="#475569" stroke-dasharray="5 5"/>
    <rect x="165" y="275" width="755" height="110" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="185" y="313" font-size="21">The body starts below the taller header text.</text>
    <text x="185" y="348" font-size="21">It can use the space below the timestamp too.</text>
    <text x="465" y="264" font-size="16" fill="#475569">body.top = max(subject.bottom, time.bottom) + gap</text>
    <text x="55" y="465" font-size="19">Subject width limit = text area - measured timestamp width - header gap</text>
    <text x="55" y="503" font-size="19">Body width limit = full text area (no timestamp space removed)</text>
    <text x="55" y="549" font-size="17">Diagram shows left-to-right placement. The sample also mirrors for RTL.</text>
  </g>
</svg>
