<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">The upper-right badge placement used by Yumi</title>
  <desc id="desc">Yumi's notification badge left edge starts halfway across the icon. Its top is 30 percent of its own height below the icon top. A count changing from 9 to 99+ grows to the right while keeping the same left edge. This differs from ordinary top-right alignment.</desc>
  <rect width="1000" height="420" rx="16" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="30" y="40" font-size="24" font-weight="bold">Upper-right badges, using Yumi's notification rule</text>
    <text x="35" y="95" font-size="19" font-weight="bold">Ordinary top-right alignment</text>
    <text x="365" y="95" font-size="19" font-weight="bold">Yumi: start at 50% width</text>
    <text x="700" y="95" font-size="19" font-weight="bold">The count becomes wider</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="80" y="160" width="140" height="140" rx="6"/>
      <rect x="405" y="160" width="140" height="140" rx="6"/>
      <rect x="730" y="160" width="140" height="140" rx="6"/>
    </g>
    <g font-size="21" text-anchor="middle">
      <text x="150" y="250">Icon</text>
      <text x="475" y="250">Icon</text>
      <text x="800" y="250">Icon</text>
    </g>
    <g fill="#b91c1c" stroke="#ffffff" stroke-width="2">
      <rect x="176" y="160" width="44" height="36" rx="18"/>
      <rect x="475" y="170" width="44" height="36" rx="18"/>
      <rect x="800" y="170" width="92" height="36" rx="18"/>
    </g>
    <g fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
      <text x="198" y="185">9</text>
      <text x="497" y="196">9</text>
      <text x="846" y="196">99+</text>
    </g>
    <g stroke="#475569" stroke-dasharray="4 4">
      <path d="M475 130V220M800 130V220"/>
      <path d="M395 160H565M720 160H912"/>
    </g>
    <text x="35" y="340" font-size="17">Right edge follows the icon.</text>
    <text x="365" y="340" font-size="17">Left edge follows the icon center.</text>
    <text x="700" y="340" font-size="17">Same left edge. Grows right.</text>
    <text x="30" y="383" font-size="18">badge.top = icon.top + 30% of measured badge height (10px here, rounded down)</text>
  </g>
</svg>
