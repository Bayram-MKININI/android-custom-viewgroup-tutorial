<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Badge center on the rounded image's upper-right corner</title>
  <desc id="desc">A rounded image and a badge are siblings. The badge center is exactly at the upper-right corner of the image's rectangular bounds. A wider 99+ badge keeps the same center. Dashed outer bounds reserve the complete image and badge, so the badge is not clipped.</desc>
  <rect width="1000" height="440" rx="16" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="30" y="40" font-size="24" font-weight="bold">Center on the corner. Not inside the image.</text>
    <text x="65" y="96" font-size="20" font-weight="bold">Count: 9</text>
    <text x="415" y="96" font-size="20" font-weight="bold">Count: 99+</text>
    <g fill="none" stroke="#64748b" stroke-dasharray="5 5">
      <rect x="80" y="136" width="210" height="204"/>
      <rect x="430" y="136" width="234" height="204"/>
    </g>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="80" y="160" width="180" height="180" rx="32"/>
      <rect x="430" y="160" width="180" height="180" rx="32"/>
    </g>
    <text x="170" y="263" text-anchor="middle" font-size="22">Image</text>
    <text x="520" y="263" text-anchor="middle" font-size="22">Image</text>
    <g fill="#b91c1c" stroke="#ffffff" stroke-width="2">
      <rect x="230" y="136" width="60" height="48" rx="24"/>
      <rect x="556" y="136" width="108" height="48" rx="24"/>
    </g>
    <g fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">
      <text x="260" y="168">9</text>
      <text x="610" y="168">99+</text>
    </g>
    <g stroke="#0f172a" stroke-dasharray="4 4">
      <path d="M260 113V210M208 160H312"/>
      <path d="M610 113V210M546 160H674"/>
    </g>
    <text x="715" y="155" font-size="18">Cross = image corner</text>
    <text x="715" y="185" font-size="18">and badge center.</text>
    <text x="715" y="240" font-size="18">Round only the image.</text>
    <text x="715" y="270" font-size="18">Do not clip the badge.</text>
    <text x="65" y="378" font-size="18">Dashed bounds reserve the whole group, including the badge outside the image.</text>
    <text x="65" y="413" font-size="18">badge.left = image.right - badge.width / 2; badge.top = image.top - badge.height / 2</text>
  </g>
</svg>
